name: automation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation
  cancel-in-progress: false

jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Checkout private repository
      - name: Checkout private repo
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.LIVE_REPO_NAME }}
          token: ${{ secrets.G_PAT }}
          path: live

      # 2. Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: live/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        working-directory: live
        run: npm ci --silent

      # 4. Run updater pipeline
      - name: Run updater pipeline
        id: pipeline
        working-directory: live
        run: |
          set -euo pipefail

          node scripts/updater/index.js > /dev/null 2>&1
          node scripts/action/merge.js > /dev/null 2>&1
          node scripts/action/jsoncon.js > /dev/null 2>&1

          if [[ -z "$(git status --porcelain playlist)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 5. Commit and push changes safely
      - name: Commit changes safely
        if: steps.pipeline.outputs.changed == 'true'
        working-directory: live
        run: |
          set -euo pipefail

          git config user.name "senvora"
          git config user.email "192395417+senvora@users.noreply.github.com"

          git add playlist/

          # Get actual changed filenames
          CHANGED_FILES=$(git diff --cached --name-only)

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "No staged changes to commit."
            exit 0
          fi

          FILE_COUNT=$(printf '%s\n' "$CHANGED_FILES" | wc -l | tr -d ' ')

          # Generate dynamic commit title
          if [[ "$FILE_COUNT" -eq 1 ]]; then
            FILE="$CHANGED_FILES"
            BASENAME=$(basename "$FILE")

            if [[ "$FILE" == playlist/token/*.json ]]; then
              NAME="${BASENAME%.json}"
              COMMIT_MESSAGE="Automated update of $NAME token"

            elif [[ "$FILE" == *.m3u || "$FILE" == *.m3u8 ]]; then
              NAME="${BASENAME%.*}"
              COMMIT_MESSAGE="Automated update of $NAME playlist"

            else
              COMMIT_MESSAGE="Automated update of $BASENAME"
            fi

          else
            COMMIT_MESSAGE="Automated update of Playlist/Json"
          fi

          # Generate commit description
          COMMIT_BODY="Automated playlist/JSON maintenance.

          Updated $FILE_COUNT files:
          "

          while IFS= read -r FILE; do
            COMMIT_BODY+="- $FILE"$'\n'
          done <<< "$CHANGED_FILES"

          echo "Commit title: $COMMIT_MESSAGE"
          echo "Commit description:"
          echo "$COMMIT_BODY"

          # Create a single commit
          git commit \
            -m "$COMMIT_MESSAGE" \
            -m "$COMMIT_BODY" \
            > /dev/null 2>&1

          # Push with retry mechanism
          for i in 1 2 3; do

            if git pull --rebase origin main > /dev/null 2>&1 && \
               git push origin HEAD:main > /dev/null 2>&1; then
              exit 0
            fi

            sleep $((i * 2))
          done

          echo "::error::Push failed after 3 attempts"
          exit 1