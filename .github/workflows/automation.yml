name: automation

on:
  workflow_dispatch:

jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.LIVE_REPO_NAME }}
          token: ${{ secrets.G_PAT }}
          fetch-depth: 0
          path: live

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: live/package-lock.json

      - name: Install dependencies
        working-directory: live
        run: |
          if [ -f package-lock.json ]; then
            npm ci --silent
          elif [ -f package.json ]; then
            npm install --silent
          fi

      - name: Run updater pipeline
        id: pipeline
        working-directory: live
        shell: bash
        run: |
          set -euo pipefail

          node scripts/updater/index.js > /dev/null 2>&1 || true
          node scripts/action/merge.js > /dev/null 2>&1 || true
          node scripts/action/jsoncon.js > /dev/null 2>&1 || true

          if [[ -z "$(git status --porcelain playlist)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit changes safely
        if: steps.pipeline.outputs.changed == 'true'
        working-directory: live
        run: |
          git config user.name "senvora"
          git config user.email "192395417+senvora@users.noreply.github.com"

          git pull --rebase origin main > /dev/null 2>&1 || true

          git add playlist/
          git commit -m "Automatically Updated" > /dev/null 2>&1 || true

          for i in 1 2 3; do
            git push origin HEAD:main > /dev/null 2>&1 && break || git pull --rebase origin main > /dev/null 2>&1
          done

      - name: Deploy JSON to Cloudflare KV
        if: steps.pipeline.outputs.changed == 'true'
        working-directory: live
        env:
          CLOUDFLARE_KV_CONFIG: ${{ secrets.CLOUDFLARE_KV_CONFIG }}
        run: node scripts/action/deploy.js > /dev/null 2>&1
